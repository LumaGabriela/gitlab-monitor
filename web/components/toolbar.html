<section class="card toolbar" id="toolbar" aria-label="Ordenação e filtros">
  <div class="field">
    <label for="sort">Ordenar por</label>
    <select id="sort" name="sort">{{sort_options}}</select>
  </div>
  <div class="field">
    <label for="author">Autor</label>
    <select id="author" name="author"><option value="">Todos</option></select>
  </div>
  <div class="field">
    <label for="pipeline">Pipeline</label>
    <select id="pipeline" name="pipeline"><option value="">Todas</option></select>
  </div>
  <div class="field field--theme">
    <label for="theme">Tema</label>
    <select id="theme" name="theme">
      <option value="auto">Automático</option>
      <option value="light">Claro</option>
      <option value="dark">Escuro</option>
    </select>
  </div>
  <button type="button" class="button button--ghost toolbar__reset" id="reset">
    Limpar filtros
  </button>
</section>
