<section class="card toolbar" id="toolbar" aria-label="Sort and filters">
  <div class="field">
    <label for="sort">Sort by</label>
    <select id="sort" name="sort">{{sort_options}}</select>
  </div>
  <div class="field">
    <label for="author">Author</label>
    <select id="author" name="author"><option value="">All</option></select>
  </div>
  <div class="field">
    <label for="pipeline">Pipeline</label>
    <select id="pipeline" name="pipeline"><option value="">All</option></select>
  </div>
  <div class="field field--theme">
    <label for="theme">Theme</label>
    <select id="theme" name="theme">
      <option value="auto">Automatic</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>
  <button type="button" class="button button--ghost toolbar__reset" id="reset">
    Clear filters
  </button>
</section>
